name: nehemiah

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nehemiah}
      POSTGRES_USER: ${POSTGRES_USER:-nehemiah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - nehemiah-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nehemiah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nehemiah}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-nehemiah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nehemiah}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      NODE_ENV: production
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-nehemiah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nehemiah}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  discord:
    profiles: ["discord"]
    build:
      context: .
      target: discord
    env_file: .env
    environment:
      NODE_ENV: production
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-nehemiah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nehemiah}
      NEHEMIAH_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  nehemiah-postgres:
